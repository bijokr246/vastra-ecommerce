<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Add Product | Vastra</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sidebar">
    <h2>VASTRA</h2>
    <ul>
      <li><a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
      <li><a href="my-products.html"><i class="fas fa-box"></i> My Products</a></li>
      <li><a href="add-product.html" class="active"><i class="fas fa-plus-circle"></i> Add Product</a></li>
      <li><a href="orders.html"><i class="fas fa-clipboard-list"></i> Orders</a></li>
      <li><a href="my-shop.html"><i class="fas fa-store"></i> My Shop</a></li>
      <li><a href="login.html"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
    </ul>
  </div>
  <div class="main">
    <div class="header"><h1>Add New Product</h1></div>
    <div class="content">
      <form action="#">
        <div class="form-group">
          <label for="product-name">Product Name</label>
          <input type="text" id="product-name" name="product-name" placeholder="e.g., Men's Slim Fit Shirt" required>
        </div>
        <div class="form-group">
          <label for="product-desc">Product Description</label>
          <textarea id="product-desc" name="product-desc" placeholder="Add a detailed description..."></textarea>
        </div>
        <div class="form-group">
          <label for="category">Category</label>
          <select id="category" name="category" required>
            <option value="">Select a Category</option>
            <option value="men">Men</option>
            <option value="women">Women</option>
            <option value="kids">Kids</option>
            <option value="accessories">Accessories</option>
          </select>
        </div>
        <div class="form-group">
          <label for="price">Price (₹)</label>
          <input type="number" id="price" name="price" placeholder="e.g., 999" required>
        </div>
        <div class="form-group">
          <label for="stock">Stock Quantity</label>
          <input type="number" id="stock" name="stock" placeholder="e.g., 100" required>
        </div>
         <div class="form-group">
          <label for="images">Product Images</label>
          <input type="file" id="images" name="images" multiple>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Submit for Approval</button>
          <button type="reset" class="btn btn-secondary">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
