<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Shop | Vastra</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sidebar">
    <h2>VASTRA</h2>
    <ul>
      <li><a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
      <li><a href="my-products.html"><i class="fas fa-box"></i> My Products</a></li>
      <li><a href="add-product.html"><i class="fas fa-plus-circle"></i> Add Product</a></li>
      <li><a href="orders.html"><i class="fas fa-clipboard-list"></i> Orders</a></li>
      <li><a href="my-shop.html" class="active"><i class="fas fa-store"></i> My Shop</a></li>
      <li><a href="login.html"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
    </ul>
  </div>
  <div class="main">
    <div class="header">
      <h1>My Shop Settings</h1>
      <a href="add-shop.html" class="btn btn-primary"><i class="fas fa-plus"></i> Add New Shop</a>
    </div>
    <div class="content">
      <form action="#">
        <div class="form-group">
          <label for="shop-name">Shop Name</label>
          <input type="text" id="shop-name" name="shop-name" value="The Style Hub" required>
        </div>
        <div class="form-group">
          <label for="shop-tagline">Shop Tagline</label>
          <input type="text" id="shop-tagline" name="shop-tagline" value="Your Fashion Destination">
        </div>
        <div class="form-group">
          <label for="shop-desc">Shop Description</label>
          <textarea id="shop-desc" name="shop-desc">We offer the latest trends in men's, women's, and kids' fashion. High quality apparel at affordable prices.</textarea>
        </div>
         <div class="form-group">
          <label for="banner">Shop Banner Image</label>
          <input type="file" id="banner" name="banner">
        </div>
        <div>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
