<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Vastra</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* === VASTRA'S ORIGINAL CSS VARIABLES & FONT STYLES === */
        :root {
            --primary: #ff3f6c;
            --primary-dark: #e6395a;
            --secondary: #282c3f;
            --light-gray: #f5f5f6;
            --dark-gray: #696b79;
            --white: #ffffff;
            --black: #000000;
            --error: #c0392b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* === NEW CSS FOR THE LOGIN PAGE LAYOUT === */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--light-gray);
        }

        .login-container {
            background-color: var(--white);
            padding: 40px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            margin: 20px;
        }

        .login-header .logo {
            font-size: 32px;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
            display: inline-block;
            margin-bottom: 10px;
        }

        .login-header .title {
            font-size: 20px;
            color: var(--secondary);
            margin-bottom: 30px;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-weight: 500;
            color: var(--secondary);
            margin-bottom: 5px;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: var(--white);
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn-login:hover {
            background-color: var(--primary-dark);
        }

        .login-footer {
            margin-top: 25px;
            font-size: 14px;
            color: var(--dark-gray);
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-header">
            <a href="home.html" class="logo">VASTRA</a>
            <h1 class="title">Administrator Login</h1>
        </div>
        <form action="#" method="POST">
            <div class="form-group">
                <label for="email">Admin Username or Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your username or email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn-login">Login</button>
        </form>
    </div>
</body>

</html>
