<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Vastra - Fashion Redefined</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #ff3f6c;
            --primary-dark: #e6395a;
            --secondary: #282c3f;
            --light-gray: #f5f5f6;
            --dark-gray: #696b79;
            --white: #ffffff;
            --black: #000000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #fafafa;
            color: var(--secondary);
        }

        .login-container {
            display: flex;
            min-height: 100vh;
        }

        .login-left {
            flex: 1;
            background-color: var(--primary);
            background: linear-gradient(135deg, #ff3f6c 0%, #ff6b8b 100%);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            color: var(--white);
        }

        @media (min-width: 768px) {
            .login-left {
                display: flex;
            }
        }

        .login-left-content {
            max-width: 400px;
            text-align: center;
        }

        .login-left h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            font-weight: 700;
        }

        .login-left p {
            font-size: 1.1rem;
            opacity: 0.9;
            margin-bottom: 2rem;
        }

        .login-left img {
            max-width: 300px;
            margin: 0 auto;
        }

        .login-right {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .login-form-container {
            max-width: 400px;
            width: 100%;
            background-color: var(--white);
            padding: 2.5rem;
            border-radius: 8px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo h2 {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 1px;
        }

        .login-form h3 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: var(--secondary);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--secondary);
        }

        .input-field {
            position: relative;
        }

        .input-field input {
            width: 100%;
            padding: 12px 15px 12px 40px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
            transition: border 0.3s;
        }

        .input-field input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--dark-gray);
        }

        .forgot-password {
            display: block;
            text-align: right;
            margin-top: 0.5rem;
            color: var(--primary);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: var(--white);
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 1rem;
        }

        .login-btn:hover {
            background-color: var(--primary-dark);
        }

        .signup-link {
            text-align: center;
            color: var(--dark-gray);
            margin-top: 1.5rem;
        }

        .signup-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .section-divider {
            margin: 2rem 0 1.5rem 0;
            border: none;
            border-top: 1px solid #eee;
        }

        .seller-link {
            text-align: center;
            color: var(--dark-gray);
            font-size: 0.9rem;
        }

        .seller-link a {
            color: var(--secondary);
            text-decoration: none;
            font-weight: 500;
        }

        .seller-link a:hover {
            color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- Left Side (Branding) -->
        <div class="login-left">
            <div class="login-left-content">
                <h1>Welcome Back!</h1>
                <p>Login to explore the latest fashion trends and exclusive offers from Vastra</p>
                <!-- <img src="https://i.imgur.com/J8ys4pR.png" alt="Vastra Fashion Illustration"> -->
                 <img src="https://img.freepik.com/free-vector/online-shopping-concept-illustration_114360-1084.jpg" alt="Woman shopping online from her laptop">
            </div>
        </div>

        <!-- Right Side (Login Form) -->
        <div class="login-right">
            <div class="login-form-container">
                <div class="logo">
                    <h2>VASTRA</h2>
                </div>

                <form class="login-form" id="loginForm">
                    <h3>Login to your account</h3>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <div class="input-field">
                            <i class="fas fa-envelope input-icon"></i>
                            <input type="email" id="email" placeholder="Enter your email" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-field">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="password" placeholder="Enter your password" required>
                        </div>
                        <a href="#" class="forgot-password">Forgot Password?</a>
                    </div>

                    <button type="submit" class="login-btn">Login</button>

                    <div class="signup-link">
                        Don't have an account? <a href="#">Sign up</a>
                    </div>
                    
                    <hr class="section-divider">

                    <div class="seller-link">
                        Are you a seller? <a href="/seller-portal">Login as Seller</a>
                        <!-- Are you a seller? <a href="/seller-portal">Access Seller Dashboard</a> -->
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (!email || !password) {
                alert('Please fill in all fields');
                return;
            }
            
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                alert('Please enter a valid email address');
                return;
            }
            
            if (password.length < 6) {
                alert('Password must be at least 6 characters long');
                return;
            }
            
            console.log('Login attempt with:', { email, password });
            
            alert('Login successful! Redirecting...');
        });

        document.querySelector('.forgot-password').addEventListener('click', function(e) {
            e.preventDefault();
            const email = prompt('Please enter your email to reset password:');
            if (email) {
                console.log('Password reset requested for:', email);
                alert('Password reset link sent to your email');
            }
        });
    </script>
</body>
</html>
