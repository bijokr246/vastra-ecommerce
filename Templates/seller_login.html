<?php
session_start();
include "config.php"; 

// If a seller is already logged in, redirect them to their dashboard
if (isset($_SESSION['is_logged_in']) && isset($_SESSION['seller_id'])) {
    header('Location: seller/dashboard.php'); // <-- IMPORTANT: Make sure this is your seller dashboard path
    exit();
}

if (isset($_POST['login'])) {
    $email = trim($_POST['email']);
    $password = trim($_POST['password']);
    $errors = [];

    //--- VALIDATE DATA --- 
    if (empty($email)) {
        $errors['email'] = 'Email address is required.';
    } 
    if (empty($password)) {
        $errors['password'] = 'Password is required.';
    }

    // --- PROCESS DATA ---
    if (empty($errors)) {
        // **SECURITY FIX: Use Prepared Statements to prevent SQL Injection**
        $sql = "SELECT user_id, email, password, role FROM login WHERE email = ? AND role = 'seller'";
        $stmt = mysqli_prepare($conn, $sql);
        
        if ($stmt) {
            mysqli_stmt_bind_param($stmt, "s", $email);
            mysqli_stmt_execute($stmt);
            $result = mysqli_stmt_get_result($stmt);

            if (mysqli_num_rows($result) === 1) {
                $row = mysqli_fetch_assoc($result);
                
                // **SECURITY FIX: Use password_verify() to check hashed passwords**
                if (password_verify($password, $row['password'])) {
                    // Password is correct, set session variables
                    $_SESSION['email'] = $row['email'];
                    $_SESSION['seller_id'] = $row['user_id']; // Use a specific seller session
                    $_SESSION['is_logged_in'] = true; 

                    // After setting session, redirect to the seller dashboard.
                    header('Location: seller/dashboard.php'); // <-- IMPORTANT: Make sure this is your seller dashboard path
                    exit();
                } else {
                    // Password does not match
                    $errors['general'] = 'Invalid email or password.';
                }
            } else {
                // No seller found with that email
                $errors['general'] = 'Invalid email or password.';
            }
            mysqli_stmt_close($stmt);
        } else {
            // Database query preparation failed
            $errors['general'] = 'A database error occurred. Please try again later.';
        }
    }
    
    // If there were any errors, store them in the session and redirect back to this page
    $_SESSION['errors'] = $errors;
    $_SESSION['old_email'] = $email;
    header('Location: seller-login.php');
    exit();
}

// --- FRONTEND DISPLAY LOGIC ---
$errors = $_SESSION['errors'] ?? [];
$old_email = $_SESSION['old_email'] ?? '';
$general_error = $errors['general'] ?? '';

// Unset the session variables
unset($_SESSION['errors'], $_SESSION['old_email']);

?>

    <script>
        // No changes needed for the JS, but I've left it here for completeness.
        const passwordInput = document.getElementById('password');
        const iconHidden = document.getElementById("iconHidden");

        iconHidden.addEventListener('click', function () {
            const isPassword = passwordInput.getAttribute('type') === 'password';
            if (isPassword) {
                passwordInput.setAttribute('type', 'text');
                iconHidden.classList.remove('fa-eye-slash');
                iconHidden.classList.add('fa-eye');
            } else {
                passwordInput.setAttribute('type', 'password');
                iconHidden.classList.remove('fa-eye');
                iconHidden.classList.add('fa-eye-slash');
            }
        });
